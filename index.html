  /* ===== HUD テーマ（ダーク＋シアン発光＋オレンジのアクセント） ===== */
  :root{
    --bg:#03060b; --panel:rgba(8,19,32,.94); --panel2:#071420; --line:rgba(55,226,255,.2); --line2:rgba(55,226,255,.5);
    --text:#e6f4ff; --muted:#8fb0c4; --accent:#37e2ff; --accent2:#2a8cff; --ok:#37e2ff; --warn:#ff9a3c; --bad:#ff5a6a; --chip:rgba(55,226,255,.06);
    --c:12px;
    --disp:'PWC Display',system-ui,"Segoe UI","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
    --mono:'PWC Mono',ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
    background-color:var(--bg);
    background-image:radial-gradient(ellipse at 70% -10%,rgba(42,140,255,.2),transparent 55%),radial-gradient(ellipse at 0% 100%,rgba(55,226,255,.07),transparent 50%),
      linear-gradient(rgba(55,226,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(55,226,255,.045) 1px,transparent 1px);
    background-size:auto,auto,40px 40px,40px 40px;min-height:100vh}
  a{color:var(--accent)}
  .mono{font-family:var(--mono);letter-spacing:.08em}
  .disp{font-family:var(--disp);letter-spacing:.06em}

  /* 角を斜めに切ったパネル：外側が枠線の色、::before が中身 */
  .card,.plist-wrap,.editor,.board,.hud{position:relative;isolation:isolate;border:none;border-radius:0;
    background:linear-gradient(135deg,rgba(55,226,255,.6),rgba(55,226,255,.14) 35%,rgba(42,140,255,.1) 70%,rgba(55,226,255,.45));
    clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c))}
  .card::before,.plist-wrap::before,.editor::before,.board::before,.hud::before{content:'';position:absolute;inset:1px;z-index:-1;
    background:linear-gradient(180deg,rgba(10,24,40,.97),rgba(5,13,22,.97));
    clip-path:polygon(calc(var(--c) - .4px) 0,100% 0,100% calc(100% - var(--c) + .4px),calc(100% - var(--c) + .4px) 100%,0 100%,0 calc(var(--c) - .4px))}

  header{position:sticky;top:0;z-index:20;background:rgba(3,8,14,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .hbar{max-width:1240px;margin:0 auto;padding:10px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:10px}
  .logo svg{flex:none}
  .ring-spin{transform-origin:50% 50%;animation:spin 6s linear infinite}
  .logo span{font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:#fff}
  .hsp{flex:1}
  .conn{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
  .dot{width:8px;height:8px;border-radius:50%;background:#3d5566}
  .dot.on{background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.4}}
  #status{color:var(--muted);font-size:11.5px;font-family:var(--mono);letter-spacing:.06em}

  select,input[type=text],input[type=number],textarea{background:var(--panel2);color:var(--text);border:1px solid rgba(55,226,255,.35);border-radius:0;padding:7px 9px;font:inherit}
  select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  input[type=checkbox],input[type=range]{accent-color:var(--accent)}

  .btn{position:relative;background:var(--chip);color:#cfeeff;border:1px solid rgba(55,226,255,.45);border-radius:0;padding:8px 15px;font:inherit;font-size:13.5px;cursor:pointer;white-space:nowrap;
    clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);transition:background .16s,box-shadow .16s,color .16s,transform .16s}
  .btn:hover:not(:disabled){background:rgba(55,226,255,.18);color:#fff;box-shadow:inset 0 0 16px rgba(55,226,255,.35);transform:translateY(-1px)}
  .btn:disabled{opacity:.35;cursor:default}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#02121a;font-weight:700}
  .btn.primary:hover:not(:disabled){background:#86f0ff;color:#02121a;box-shadow:0 0 20px rgba(55,226,255,.55)}
  .btn.big{font-size:17px;padding:12px 30px}
  .btn.small{padding:5px 11px;font-size:13px}
  .btn.tiny{padding:3px 9px;font-size:12px;clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
  .btn.danger{color:#ffc58f;border-color:rgba(255,154,60,.6);background:rgba(255,154,60,.06)}
  .btn.danger:hover:not(:disabled){background:rgba(255,154,60,.2);color:#fff;box-shadow:inset 0 0 16px rgba(255,154,60,.3)}
  .chk{display:flex;align-items:center;gap:7px;margin:6px 0;cursor:pointer}

  main{max-width:1240px;margin:0 auto;padding:20px 22px}
  .card{padding:18px 20px;margin-bottom:16px}
  .card h3,.editor h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:9px}
  .card h3::before,.editor h3::before{content:'';width:7px;height:7px;background:var(--accent);box-shadow:0 0 8px var(--accent);flex:none}
  .hint,small{color:var(--muted);font-size:12.5px}
  .warn{color:var(--warn)}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
  .pre{white-space:pre-line}
  details summary{cursor:pointer;color:var(--muted)}
  details[open] summary{margin-bottom:8px}
  .notice{background:rgba(255,154,60,.08);border:1px solid rgba(255,154,60,.45);color:#ffd2a6;padding:9px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
  .banner{background:rgba(255,90,106,.1);border:1px solid rgba(255,90,106,.5);padding:9px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px}

  /* ボード情報の帯 */
  .board{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 20px;margin-bottom:14px}
  .board b{font-family:var(--disp);font-size:19px;font-weight:700;letter-spacing:.04em;color:#fff}
  .board span{color:var(--muted);margin-left:10px;font-size:13px}
  .board-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .batt{display:inline-flex;align-items:center;vertical-align:middle;cursor:help}
  .board .batt span,.board #batVal{margin-left:0}
  .board .batt{margin-left:4px}
  .batt-body{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--accent);height:14px}
  .batt-body i{display:inline-block;width:5px;height:100%}
  .batt-tip{width:3px;height:6px;background:var(--accent);margin-left:1px}

  /* タブ（番号つき） */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;counter-reset:tab}
  .tabs button{background:none;border:none;color:#9fc3d6;padding:11px 20px 9px;font:inherit;font-size:15px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,background .15s}
  .tabs button::before{counter-increment:tab;content:'0' counter(tab);font-family:var(--mono);font-size:11px;margin-right:9px;color:#6f93a8}
  .tabs button:hover{color:#fff;background:rgba(55,226,255,.05)}
  .tabs button.active{color:#fff;font-weight:700;border-bottom-color:var(--accent);box-shadow:0 10px 18px -12px rgba(55,226,255,.9)}
  .tabs button.active::before{color:var(--accent)}
  .locked{opacity:.45;pointer-events:none}

  /* プリセット一覧 */
  .pgrid{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
  @media (max-width:860px){.pgrid{grid-template-columns:1fr}.plist-wrap{position:relative !important;top:auto !important}.plist{max-height:300px}}
  .plist-wrap{position:sticky;top:76px}
  .plist-head{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
  .plist-head b{font-family:var(--disp);font-size:15px;letter-spacing:.05em}
  .plist{max-height:calc(100vh - 240px);overflow:auto}
  .pitem{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid rgba(55,226,255,.08);cursor:pointer;user-select:none;transition:background .15s,padding-left .15s}
  .pitem:hover{background:rgba(55,226,255,.07);padding-left:19px}
  .pitem.sel{background:rgba(55,226,255,.12);box-shadow:inset 3px 0 0 var(--accent)}
  .pitem.chk{background:rgba(255,154,60,.1);box-shadow:inset 3px 0 0 var(--warn)}
  .pitem.dragging{opacity:.35}
  .pitem.dropa{box-shadow:inset 0 3px 0 var(--accent)} .pitem.dropb{box-shadow:inset 0 -3px 0 var(--accent)}
  .pitem .num{width:22px;text-align:right;color:#6f93a8;font-size:12px;font-family:var(--mono)}
  .pitem.sel .num{color:var(--accent)}
  .pitem .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
  .pitem.sel .nm{font-weight:700}
  .badge{color:#9ff1ff;border:1px solid rgba(55,226,255,.55);padding:0 7px;font-size:11px;white-space:nowrap;font-family:var(--mono);letter-spacing:.06em}
  .bulk{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 12px;background:rgba(255,154,60,.1);border-bottom:1px solid rgba(255,154,60,.4)}
  .sw{display:inline-block;width:6px;height:20px;box-shadow:0 0 8px currentColor;flex:none}
  .sw-none{background:repeating-linear-gradient(45deg,#333 0 3px,#555 3px 6px)}
  .rowplay{background:rgba(55,226,255,.05);border:1px solid rgba(55,226,255,.4);color:#9fc3d6;width:26px;height:24px;font-size:10px;cursor:pointer;padding:0;flex:none;
    clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
  .rowplay:hover{color:#fff;background:rgba(55,226,255,.2)}

  /* プレビュー */
  .rightcol{display:flex;flex-direction:column;gap:16px;min-width:0}
  .pv{margin:0;overflow:hidden}
  .pv::after{content:'';position:absolute;left:0;right:0;top:-30%;height:30%;background:linear-gradient(180deg,transparent,rgba(55,226,255,.07),transparent);animation:scan 6s linear infinite;pointer-events:none}
  @keyframes scan{to{top:110%}}
  .pv-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .pv-head h3{margin:0}
  .cvwrap{position:relative;margin-bottom:12px}
  .cvwrap .cv-l{position:absolute;top:6px;left:10px;font-size:10px;color:#6f93a8;pointer-events:none}
  #saberCv{width:100%;height:auto;aspect-ratio:900/110;display:block;border:1px solid rgba(55,226,255,.18);
    background:repeating-linear-gradient(90deg,rgba(55,226,255,.05) 0 1px,transparent 1px 24px),radial-gradient(ellipse at 40% 50%,#0d1826,#04080e 70%)}
  .pv-row{display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid rgba(55,226,255,.12)}
  .pv-row .k{color:var(--muted);font-size:13px;margin-right:6px;white-space:nowrap}
  .pv .vol .hint{white-space:nowrap}
  .pv .vol{flex:1;min-width:260px}
  .pv .vol b{font-family:var(--disp);font-size:20px;min-width:52px}
  .bgm{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .bgm select{max-width:230px}
  .chk.small{font-size:12.5px;color:var(--muted)}
  .acts{display:flex;flex-wrap:wrap;gap:7px}
  .act.act-on{background:rgba(55,226,255,.24);border-color:var(--accent);color:#fff;box-shadow:inset 0 0 14px rgba(55,226,255,.55),0 0 10px rgba(55,226,255,.35)}
  .act.act-dim{opacity:.35}

  /* 編集 */
  .editor{padding:18px 22px}
  .ed-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .ed-head h2{margin:0;font-family:var(--disp);font-size:24px;letter-spacing:.03em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;color:#fff}
  .ed-head .num{color:var(--accent);font-family:var(--mono);font-size:14px;margin-right:10px}
  .ed-head .badge{font-size:11px}
  .ed-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:12px 0 16px;padding-bottom:14px;border-bottom:1px solid rgba(55,226,255,.14)}
  .ed-tools .sp{flex:1}
  .moveto input{width:58px;padding:4px 6px;margin-right:4px}
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .fields label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12.5px}
  .fields input,.fields select{color:#fff;font-size:14px;padding:9px 10px}
  .editor h3{margin:22px 0 8px}
  .blade{border:1px solid rgba(55,226,255,.18);padding:12px 14px;margin-top:10px;background:rgba(55,226,255,.03)}
  .blade-h{font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:10px}
  .blade-h b{font-family:var(--disp);letter-spacing:.05em}
  .blade-h .hint{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em}
  .crow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:5px 0}
  .crow .clabel{min-width:150px;color:#cfe3ee}
  .crow.big .clabel{font-weight:700;color:#fff}
  .pal{display:flex;gap:6px;flex-wrap:wrap}
  .pchip{position:relative;width:24px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,.18);cursor:pointer;padding:0;opacity:.78;transition:opacity .15s,transform .15s,box-shadow .15s;
    box-shadow:inset 0 0 0 3px rgba(4,10,18,.72),inset 0 -5px 7px rgba(0,0,0,.45)}
  .pchip:hover{opacity:1;transform:scale(1.12)}
  .pal.sm .pchip{width:18px;height:18px;box-shadow:inset 0 0 0 2px rgba(4,10,18,.72),inset 0 -4px 5px rgba(0,0,0,.45)}
  .pchip.on{opacity:1;border-color:#fff;box-shadow:inset 0 0 0 3px rgba(4,10,18,.55),0 0 0 2px #03060b,0 0 0 3px var(--accent),0 0 12px rgba(55,226,255,.55)}
  .cpick input{width:34px;height:24px;padding:0;border:1px solid rgba(55,226,255,.35);background:none;cursor:pointer;opacity:.85}
  .ledn{min-width:44px;color:#cfe3ee}
  .fx{margin-top:6px}
  .ints{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
  .ints label{display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--muted);font-size:13px}
  .ints input{width:90px}
  textarea{width:100%;height:90px;font:12px/1.4 var(--mono)}
  .savebar{position:sticky;bottom:0;display:flex;justify-content:flex-end;align-items:center;gap:10px;margin:18px -22px -18px;padding:13px 22px;background:rgba(5,13,22,.97);border-top:1px solid rgba(55,226,255,.2)}
  .savebar .unsaved{display:none;color:#ffc58f;margin-right:auto;align-items:center;gap:9px}
  .savebar .unsaved::before{content:'';width:8px;height:8px;background:var(--warn);box-shadow:0 0 10px var(--warn);animation:pulse 1.4s ease-in-out infinite}
  .savebar.dirty{border-top-color:rgba(255,154,60,.5);background:linear-gradient(90deg,rgba(255,154,60,.12),rgba(5,13,22,.97) 55%)}
  .savebar.dirty .unsaved{display:inline-flex}
  .savebar.solo{position:static;margin:0;border:1px solid rgba(55,226,255,.3);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}

  /* セーバー設定 */
  .vol{display:flex;align-items:center;gap:14px}
  .vol input{flex:1;max-width:520px}
  .vol b{font-size:22px;min-width:64px}
  .sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
  .sgrid label,.sgrid .lbl{display:flex;flex-direction:column;gap:5px}
  .sgrid label.gauge{align-items:center;text-align:center}
  .ring{display:block;margin:0 auto 4px}
  .ring .rv{font-family:var(--disp);font-weight:700}
  .ring .ru{font-family:var(--mono)}
  .ring .rspin{transform-origin:50% 50%;animation:spin 16s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .inl{display:flex;align-items:center;gap:6px}
  .inl input{width:90px}
  .gestures{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 12px}
  .gestures .chk{margin:0;padding:11px 13px;border:1px solid rgba(55,226,255,.16);background:rgba(55,226,255,.03);transition:background .15s,border-color .15s}
  .gestures .chk:hover{background:rgba(55,226,255,.09);border-color:rgba(55,226,255,.45)}
  .gestures.nums{margin-top:14px;padding-top:14px;border-top:1px solid rgba(55,226,255,.14)}
  .gnum{display:flex;flex-direction:column;gap:3px;margin:6px 0}
  .gnum input{width:110px}

  /* 表 */
  .tw{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{border-bottom:1px solid rgba(55,226,255,.12);padding:8px 9px;text-align:left}
  th{color:#6f93a8;font-weight:400;font-family:var(--mono);letter-spacing:.06em;font-size:12px}
  tr.manual td{background:rgba(55,226,255,.06)}
  .nowrap{white-space:nowrap}
  .danger-card{--line2:rgba(255,154,60,.5)}
  .log{background:#02060b;border:1px solid rgba(55,226,255,.2);padding:10px;max-height:320px;overflow:auto;font:12px/1.45 var(--mono);white-space:pre-wrap}

  /* 処理中 */
  .progress{position:fixed;left:0;right:0;top:0;z-index:50}
  .progress .bar{height:2px;background:rgba(55,226,255,.12);overflow:hidden}
  .progress .bar div{height:100%;width:0;background:var(--accent);transition:width .2s;box-shadow:0 0 8px var(--accent)}
  .progress.indeterminate .bar div{width:30% !important;animation:indet 1.1s infinite ease-in-out}
  @keyframes indet{0%{margin-left:-30%}100%{margin-left:100%}}
  .progress .lbl{position:fixed;left:50%;top:66px;transform:translateX(-50%);background:rgba(5,13,22,.97);border:1px solid var(--line2);color:#fff;padding:8px 18px;font-size:13px;
    box-shadow:0 0 22px rgba(55,226,255,.25);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
  body.is-busy main{pointer-events:none}
  body.is-busy main .tabbody,body.is-busy main .editor{opacity:.6}
  body.booting .progress{display:none}
  .fxrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:4px 0 10px}.fxrow .k{font-weight:600;min-width:140px}.fxrow select{max-width:260px}.fxrow small{flex-basis:100%}

  /* ===== トップページ ===== */
  .welcome{display:flex;flex-wrap:wrap;gap:48px;align-items:center;justify-content:center;padding:28px 0 10px}
  .w-left{flex:1 1 440px;display:flex;flex-direction:column;align-items:center;gap:22px}
  .w-ring{position:relative;width:420px;max-width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
  .w-ring svg{position:absolute;inset:0;width:100%;height:100%}
  .w-ring .r1{transform-origin:50% 50%;animation:spin 28s linear infinite reverse}
  .w-ring .r2{transform-origin:50% 50%;animation:spin 18s linear infinite}
  .w-ring .r3{transform-origin:50% 50%;animation:spin 6s linear infinite}
  .cta{position:relative;font-family:var(--disp);font-size:20px;font-weight:700;letter-spacing:.18em;color:#02121a;background:var(--accent);border:none;padding:18px 40px;min-height:60px;cursor:pointer;
    clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);box-shadow:0 0 30px rgba(55,226,255,.55);transition:transform .2s,background .2s}
  .cta:hover{background:#86f0ff;transform:scale(1.04)}
  .w-right{flex:1 1 420px;max-width:540px;display:flex;flex-direction:column;gap:18px}
  .w-kick{font-size:11px;color:var(--accent)}
  .w-title{margin:6px 0 0;font-family:var(--disp);font-size:40px;line-height:1.15;color:#fff;letter-spacing:.06em;text-shadow:0 0 24px rgba(55,226,255,.45)}
  .w-sub{margin:8px 0 0;font-size:16px;color:#cfe3ee}
  .steps{list-style:none;margin:0;padding:6px 0;counter-reset:st}
  .steps li{display:flex;gap:16px;align-items:center;padding:12px 20px;font-size:15px;transition:transform .2s,background .2s}
  .steps li+li{border-top:1px solid rgba(55,226,255,.1)}
  .steps li::before{counter-increment:st;content:'0' counter(st);font-family:var(--disp);font-size:20px;font-weight:700;color:var(--accent);width:30px;flex:none}
  .steps li:hover{transform:translateX(6px);background:rgba(55,226,255,.06)}
  .privacy{color:var(--muted);font-size:13px;margin:0;text-align:center}
  .trouble-card{padding:14px 20px}
  .trouble-card .tt{display:flex;gap:10px;align-items:center;font-weight:700;color:#ffc58f;cursor:pointer;list-style:none;user-select:none}
  .trouble-card .tt::-webkit-details-marker{display:none}
  .trouble-card .tt::after{content:'＋';margin-left:auto;font-family:var(--mono);color:var(--muted)}
  .trouble-card[open] .tt::after{content:'－'}
  .trouble-card .tt::before{content:'';width:8px;height:8px;background:var(--warn);box-shadow:0 0 8px var(--warn)}
  .trouble{margin:10px 0 0;padding-left:20px;font-size:13px;line-height:1.85;color:#cfe3ee}
  .trouble li{margin:2px 0}

  /* ===== 初回接続のロード画面 ===== */
  #boot{position:fixed;inset:0;z-index:40;background:#000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
  #boot.on{opacity:1;pointer-events:auto}
  #boot.out{opacity:0;transition:opacity .35s}
  .boot-in{width:440px;max-width:86vw;opacity:0;transition:opacity .3s .15s}
  #boot.on .boot-in{opacity:1}
  .boot-bar{position:relative;height:16px;border:1px solid rgba(220,230,255,.55);background:rgba(0,0,0,.5)}
  .boot-bar span{position:absolute;left:1px;top:1px;bottom:1px;width:0;background:#d9dee8;transition:width .35s ease-out}
  .boot-bar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 11px var(--mono);color:#fff;mix-blend-mode:difference}

  const s = (LANG[lang] && LANG[lang][k]) ?? LANG.ja[k] ?? k;
  return s.replace(/\{(\w+)\}/g, (m, x) => v[x] ?? '');
}
const L = o => o[lang] ?? o.ja;
/** 言語ごとの区切り記号（日本語は全角、英語は半角） */
const P = () => lang === 'ja' ? {l: '（', r: '）', c: '：', s: '／', d: '・', b: '・'} : {l: ' (', r: ')', c: ': ', s: ' / ', d: ' · ', b: '• '};

function fmtDate(d = new Date()){ return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
/** "Nov 14 2026 05:46:34"（ファームウェアのビルド日時）→ "2026/11/14 05:46:34" */
function fmtBuildDate(s){
  const m = /^([A-Z][a-z]{2})\s+(\d{1,2})\s+(\d{4})\s+(\d{2}:\d{2}:\d{2})$/.exec((s || '').trim());
  if (!m) return s || '';
  const mon = 'JanFebMarAprMayJunJulAugSepOctNovDec'.indexOf(m[1]) / 3 + 1;
  return mon > 0 ? `${m[3]}/${pad(mon)}/${pad(m[2])} ${m[4]}` : s;
}
function downloadText(name, text, bom = true){
  const blob = new Blob([bom ? '﻿' : '', text.replace(/\r?\n/g, '\r\n')], {type: 'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/** SD チェックの目安（同時に鳴らせる音の数）。仮の値：実測で調整する */
/* 目安は ProffieBoard v3 ユーザーマニュアル（Dmitry Shtok）p.35 の実測表から。
   推奨は 900 kb/s 以上（≒10 本）、BEST 欄は 12〜15 本、BAD 欄は 8 本前後 */
const SD_GOOD = 15, SD_OK = 10, SD_FULL = 25;
/** ゲージ上の位置（%）。BAD 0〜10 を 40%、GOOD 10〜15 を 20%、BEST 15〜25 を 40%。25 以上は満タン */
const sdPos = v => v >= SD_FULL ? 100 : v >= SD_GOOD ? 60 + (v - SD_GOOD) / (SD_FULL - SD_GOOD) * 40 : v >= SD_OK ? 40 + (v - SD_OK) / (SD_GOOD - SD_OK) * 20 : Math.max(0, v) / SD_OK * 40;
const VOL_SAFE = 1500, VOL_HARD = 3000;
function volColor(v){
  // 色は上限ではなく音量の値で決める：〜1000 通常、1500 でオレンジ、3000 で赤
  if (v == null || v <= 1000) return '';
  const hue = v <= 1500 ? 48 - 18 * (v - 1000) / 500 : 30 - 30 * Math.min(1, (v - 1500) / 1500);
  return `hsl(${Math.round(hue)}, 92%, 56%)`;
}

/** 電池残量％（ProffieOS の battery_percent と同じ式：4.1V=100%、2.85V=0%、電圧の2乗に比例） */
function battPct(v){
  if (v == null) return null;
  const lo = 2.85, hi = 4.1;
  return Math.round(100 * Math.max(0, Math.min(1, (v * v - lo * lo) / (hi * hi - lo * lo))));
}
/** 電池の目盛り（0〜4）。測定のむらで行ったり来たりしないよう、直近の中央値＋境目の余裕で決める */
const Batt = {
  hist: [], level: null,
  push(v){
    if (v == null) return;
    this.hist.push(v); if (this.hist.length > 5) this.hist.shift();
    const med = [...this.hist].sort((x, y) => x - y)[Math.floor(this.hist.length / 2)];
    const p = battPct(med), cuts = [10, 25, 50, 75], M = 5;
    const lv = x => cuts.filter(c => x > c).length;
    if (this.level == null) this.level = lv(p);
    else if (p > cuts[this.level] + M && this.level < 4) this.level = lv(p - M);    // 上がるのは境目を5%以上越えたとき
    else if (this.level > 0 && p < cuts[this.level - 1] - M) this.level = lv(p + M); // 下がるのも同様
    this.v = med;
  },
  reset(){ this.hist = []; this.level = null; }
};
/** スマートフォン風の4目盛り電池アイコン（％は出さない。電圧はマウスを乗せると表示） */
function battHtml(){
  if (Batt.level == null) return '―';
  const n = Batt.level, col = n >= 3 ? 'var(--ok)' : n === 2 ? 'var(--warn)' : 'var(--bad)';
  return `<span class="batt" title="${Batt.v.toFixed(2)} V"><span class="batt-body">${[0, 1, 2, 3].map(i =>
    `<i style="background:${i < n ? col : 'transparent'}"></i>`).join('')}</span><span class="batt-tip"></span></span>`;
}

/* =====================================================================
 * セーバーとの通信（Web Serial）
 *   Proffieboard: VID 0x1209
 *   返答の終わりは「#目印」行のエコーで判定（ProffieOS は # で始まる行をそのまま返す）
 * ===================================================================== */
const Proffie = {
  port: null, reader: null, writer: null, buf: '', readLoopDone: null, cancel: false, _seq: 0, _chain: Promise.resolve(),
  onChange: () => {},
  get connected(){ return !!this.port; },

  async connect(){
    let port;
    try { port = await navigator.serial.requestPort({filters: [{usbVendorId: 0x1209}]}); }
    catch (e) { if (e.name === 'NotFoundError') return false; throw e; }
    await this.open(port);
    return true;
  },
  async open(port){
    try { await port.open({baudRate: 115200, bufferSize: 65536}); }
    catch (e) { const er = new Error(t('openFailBody')); er.title = t('openFail'); throw er; }
    try { await port.setSignals({dataTerminalReady: true, requestToSend: true}); } catch {}
    this.port = port; this.buf = '';
    this.writer = port.writable.getWriter();
    this.readLoopDone = this._readLoop();
    this.onChange();
  },
  async _readLoop(){
    const dec = new TextDecoder();
    while (this.port && this.port.readable) {
      this.reader = this.port.readable.getReader();
      try {
        while (true) {
          const {value, done} = await this.reader.read();
          if (done) break;
          this.buf += dec.decode(value, {stream: true});
          if (this._wake) { const w = this._wake; this._wake = null; w(); }   // 返事を待っている query をすぐ起こす
        }
      } catch { break; }
      finally { try { this.reader.releaseLock(); } catch {} this.reader = null; }
    }
  },
  async disconnect(){
    const port = this.port; if (!port) return;
    this.port = null;
    try { if (this.reader) await this.reader.cancel(); } catch {}
    try { await Promise.race([this.readLoopDone, sleep(1500)]); } catch {}   // 読み取りが止まらなくても先へ進む
    try { this.writer.releaseLock(); } catch {}
    this.writer = null;
    try { await port.close(); } catch {}
    this.onChange();
  },
  async write(s){
    if (!this.writer) throw new Error(t('lost'));
    await this.writer.write(new TextEncoder().encode(s));
  },
  /** シリアルを使う処理を1つずつ順番に実行 */
  run(fn){ const p = this._chain.then(fn, fn); this._chain = p.catch(() => {}); return p; },
  /** コマンドを送り、直後に送った #目印 が返るまでを返答とする */
  async query(cmd, {timeoutMs = 8000} = {}){
    const tag = `#PWC${(++this._seq).toString(36)}${Date.now().toString(36).slice(-4)}`;
    const mark = this.buf.length;
    await this.write(`${cmd}\n${tag}\n`);
    const start = Date.now();
    let text, timedOut = false;
    while (true) {
      if (!this.port) throw new Error(t('lost'));
      const i = this.buf.indexOf(tag, mark);
      if (i >= 0) { text = this.buf.slice(mark, i); this.buf = this.buf.slice(i + tag.length).replace(/^\r?\n/, ''); break; }
      if (Date.now() - start > timeoutMs) { text = this.buf.slice(mark); this.buf = ''; timedOut = true; break; }
      // 受信したらすぐ続きへ（決まった間隔で待たない）。切断などに備えて 50ms で見直す
      await Promise.race([new Promise(r => { this._wake = r; }), sleep(50)]);
    }
    text = text.replace(/\r/g, '').replace(/^-\+=(BEGIN|END)_OUTPUT=\+-\n?/gm, '').replace(/^Style RAM = \d+\n?/gm, '');
    return {text, whut: /^Whut\? :/m.test(text), timedOut};
  },
  /** 受信が静かになるまで待つ */
  async settle(quietMs = 400){
    let len = this.buf.length, since = Date.now();
    while (Date.now() - since < quietMs) { await sleep(50); if (this.buf.length !== len) { len = this.buf.length; since = Date.now(); } }
    this.buf = '';
  }
};

/* =====================================================================
 * 返答の解析
 * ===================================================================== */
const PP = {
  unescape(v){ return v.replace(/\\(.)/g, (m, c) => c === 'n' ? '\n' : c === 't' ? '\t' : c); },
  presets(text){
    const out = []; let cur = null;
    for (const line of text.split('\n')) {
      const m = /^([A-Z]+\d*)=(.*)$/.exec(line.trim());
      if (!m) continue;
      const [, k, raw] = m, v = this.unescape(raw);
      if (k === 'FONT') { cur = {font: v, track: '', styles: [], name: '', variation: 0}; out.push(cur); }
      if (!cur) continue;
      if (k === 'TRACK') cur.track = v;
      else if (/^STYLE\d+$/.test(k)) cur.styles[+k.slice(5) - 1] = v;
      else if (k === 'NAME') cur.name = v;
      else if (k === 'VARIATION') cur.variation = +v || 0;
    }
    return out;
  },
  version(text){
    const r = {version: '', config: '', prop: '', buttons: '', installed: ''};
    for (const l of text.split('\n').map(s => s.trim()).filter(Boolean)) {
      let m;
      if ((m = /^prop:\s*(.*)$/.exec(l))) r.prop = m[1];
      else if ((m = /^buttons:\s*(.*)$/.exec(l))) r.buttons = m[1];
      else if ((m = /^installed:\s*(.*)$/.exec(l))) r.installed = m[1];
      else if (/\.h$/.test(l)) r.config = l;
      else if (!r.version) r.version = l;
    }
    return r;
  },
  /** 数値だけの行（最後のもの）を採用。途中に別メッセージが混ざっても読み違えない */
  number(res){
    if (res.whut || res.timedOut) return null;
    const ls = res.text.split('\n').map(x => x.trim()).filter(x => /^-?\d+(\.\d+)?$/.test(x));
    return ls.length ? +ls[ls.length - 1] : null;
  },
  lines(res){ return res.whut || res.timedOut ? null : res.text.split('\n').map(s => s.trim()).filter(Boolean); },
  style(s){
    const w = (s || '').trim().split(/\s+/);
    if (w[0] !== 'builtin') return {builtin: null, args: [], raw: s};
    return {builtin: {preset: +w[1], blade: +w[2]}, args: [null, ...w.slice(3)], raw: s};
  },
  buildStyle(s, changes){
    const st = this.style(s), args = st.args.slice(1);
    for (const [k, v] of Object.entries(changes)) { while (args.length < +k) args.push('~'); args[+k - 1] = v; }
    while (args.length && args[args.length - 1] === '~') args.pop();
    return ['builtin', st.builtin.preset, st.builtin.blade, ...args].join(' ');
  },
  /** describe_named_style → [, {type, def}, ...]。引数の行（COLOR / INT / VOID）だけ拾う */
  describe(text){
    const lines = text.split('\n').map(l => l.trim()).filter(l => /^(COLOR|INT|VOID)( |$)/.test(l));
    if (lines.length < 2) return null;
    const items = lines.map(l => { const i = l.indexOf(' '); return i < 0 ? {type: l, def: ''} : {type: l.slice(0, i), def: l.slice(i + 1).trim()}; });
    return [null, ...items.slice(2)];
  },
  color16(v){
    const m = /^(\d+),(\d+),(\d+)$/.exec(v || '');
    if (!m) return null;
    const c = x => Math.max(0, Math.min(255, Math.round(+x / 257)));
    return {r: c(m[1]), g: c(m[2]), b: c(m[3])};
  },
  hex(v){ const c = this.color16(v); return c ? '#' + [c.r, c.g, c.b].map(x => x.toString(16).padStart(2, '0')).join('') : '#000000'; },
  from8(r, g, b){ return [r, g, b].map(x => x * 257).join(','); },
  fromHex(h){ const n = parseInt(h.slice(1), 16); return this.from8((n >> 16) & 255, (n >> 8) & 255, n & 255); }
};

/* =====================================================================
 * セーバーのプレビュー（イメージ表示）
 *   色・点灯/消灯時間・各エフェクトの色から、ブレードの様子を描く
 * ===================================================================== */
const Preview = {
  cv: null, ctx: null, raf: 0, on: true, ext: 1, extFrom: 1, extTo: 1, extStart: 0, extDur: 300,
  fx: [], lockType: null, getColors: () => null,

  attach(cv, getColors){
    this.cv = cv; this.getColors = getColors;
    this.ctx = cv && cv.getContext ? cv.getContext('2d') : null;
    if (!this.ctx) return;
    cancelAnimationFrame(this.raf);
    const loop = () => { if (!this.cv || !this.cv.isConnected) return; this.draw(); this.raf = requestAnimationFrame(loop); };
    this.raf = requestAnimationFrame(loop);
  },

  LOCKUPS: ['lock', 'drag', 'lb', 'melt'],
  /** そのボタンが今効くか（ProffieOS の動きに合わせる） */
  canDo(cmd){
    if (cmd === 'on' || cmd === 'off' || cmd === 'quote' || cmd === 'force') return true;
    if (!this.on) return false;
    if (cmd === 'clash' || cmd === 'stab') return !this.lockType;   // ロックアップ中はクラッシュ・スタブが効かない
    return true;
  },
  trigger(cmd){
    const now = performance.now(), c = this.getColors() || {};
    if (cmd === 'on') { if (!this.on) { this.on = true; this.anim(1, c.ign || 300); } }
    else if (cmd === 'off') { if (this.on) { this.on = false; this.lockType = null; this.anim(0, c.ret || 500); } }
    else if (this.LOCKUPS.includes(cmd)) {
      // 同時に1つだけ。発動中にどれかを押すと、今の効果が終わるだけ
      if (this.on) this.lockType = this.lockType ? null : cmd;
    }
    else if (cmd === 'clash' || cmd === 'stab') { if (this.canDo(cmd)) this.fx.push({type: cmd, t: now}); }
    else if (cmd === 'blast') { if (this.on) this.fx.push({type: cmd, t: now, pos: 0.25 + Math.random() * 0.6}); }
    // force / quote は音だけ（光り方はスタイルによるので描かない）
  },
  /** 実機の点灯状態に合わせる */
  setState(on){ this.on = !!on; this.ext = this.extFrom = this.extTo = on ? 1 : 0; this.lockType = null; this.fx = []; },
  anim(to, dur){ this.extFrom = this.ext; this.extTo = to; this.extStart = performance.now(); this.extDur = Math.max(50, dur); },

  draw(){
    const cv = this.cv, ctx = this.ctx, W = cv.width, H = cv.height, now = performance.now();
    const c = this.getColors() || {};
    ctx.clearRect(0, 0, W, H);
    // 伸び縮み
    const k = Math.min(1, (now - this.extStart) / this.extDur);
    this.ext = this.extFrom + (this.extTo - this.extFrom) * (this.extTo > this.extFrom ? k : 1 - Math.pow(1 - k, 2));
    const L = Math.round(W * 0.21), hx = 14, cy = H / 2, x0 = hx + L - 2, len = W - x0 - 18, bw = Math.max(12, H * 0.13);
    // スイッチの色：アクセントブレードがあればその色、なければメインカラー。消灯中は消える
    const acc = (c.accents || []).find(Boolean) || c.base || [200, 200, 200];
    const lvl = Math.max(0, Math.min(1, this.ext * 1.5));
    this.drawHilt(ctx, hx, cy, L, acc, lvl);
    if (this.ext <= 0.001) return;
    // ブレードの色（区間ごと）
    const N = 72, lit = Math.round(N * this.ext), base = c.base || [200, 200, 200];
    const flick = 0.92 + 0.08 * Math.sin(now / 37) * Math.sin(now / 53);
    const seg = [];
    for (let i = 0; i < lit; i++) {
      let col = base.map(v => v * flick), p = i / (N - 1);
      for (const f of this.fx) {
        const age = now - f.t;
        if (f.type === 'clash' && age < 260) col = this.mix(col, c.clash || [255, 255, 255], 1 - age / 260);
        if (f.type === 'blast' && age < 500) col = this.mix(col, c.blast || [255, 255, 255], Math.exp(-Math.pow((p - f.pos) / 0.05, 2)) * (1 - age / 500));
        if (f.type === 'stab' && age < 350) col = this.mix(col, c.stab || [255, 120, 0], Math.max(0, (p - 0.75) / 0.25) * (1 - age / 350));
      }
      const lp = c.lockPos ?? 0.5, lt = this.lockType;
      if (lt === 'lock') col = this.mix(col, c.lockup || [255, 255, 255], Math.exp(-Math.pow((p - lp) / 0.12, 2)) * (0.6 + 0.4 * Math.random()));
      if (lt === 'lb') col = this.mix(col, c.lb || [200, 220, 255], (Math.random() < 0.35 ? 0.9 : 0.2) * (0.5 + 0.5 * Math.sin(p * 40 + now / 30)));
      if (lt === 'drag') col = this.mix(col, c.drag || [255, 255, 255], Math.max(0, (p - 0.85) / 0.15) * (0.5 + 0.5 * Math.random()));
      if (lt === 'melt') col = this.mix(col, c.stab || [255, 120, 0], Math.max(0, (p - 0.8) / 0.2) * (0.8 + 0.2 * Math.sin(now / 90)));
      seg.push(col.map(v => Math.max(0, Math.min(255, Math.round(v)))));
    }
    this.fx = this.fx.filter(f => now - f.t < 700);
    // 外側の光
    const tipX = x0 + len * this.ext;
    for (let i = 0; i < seg.length; i++) {
      const x = x0 + (i / N) * len, w = len / N + 1, col = `rgb(${seg[i].join(',')})`;
      ctx.shadowColor = col; ctx.shadowBlur = bw * 1.6;
      ctx.fillStyle = col; ctx.fillRect(x, cy - bw / 2, w, bw);
    }
    ctx.shadowBlur = 0;
    // 芯（白っぽく）
    const core = ctx.createLinearGradient(0, cy - bw / 2, 0, cy + bw / 2);
    core.addColorStop(0, 'rgba(255,255,255,0)'); core.addColorStop(0.5, 'rgba(255,255,255,.75)'); core.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = core; ctx.fillRect(x0, cy - bw * 0.3, tipX - x0, bw * 0.6);
    // 先端を丸く
    const last = seg.length ? `rgb(${seg[seg.length - 1].join(',')})` : '#fff';
    ctx.beginPath(); ctx.arc(tipX, cy, bw / 2, -Math.PI / 2, Math.PI / 2);
    ctx.fillStyle = last; ctx.shadowColor = last; ctx.shadowBlur = bw * 1.6; ctx.fill(); ctx.shadowBlur = 0;
  },
  /** 柄（案A：クラシック。銀の本体＋黒いリブのグリップ＋ベント付きエミッター） */
  drawHilt(ctx, x, cy, L, acc, lvl){
    const H = 34, y = cy - H / 2;
    const metal = (yy, hh, st) => { const g = ctx.createLinearGradient(0, yy, 0, yy + hh); st.forEach(([o, c]) => g.addColorStop(o, c)); return g; };
    const SILVER = [[0, '#7d858f'], [0.22, '#eef1f4'], [0.5, '#b9c0c8'], [0.8, '#6c737c'], [1, '#3e444b']];
    // ポンメル
    ctx.fillStyle = metal(y - 2, H + 4, SILVER); this.rr(ctx, x, y - 2, L * 0.07, H + 4, 6); ctx.fill();
    ctx.fillStyle = '#2b2f34'; ctx.fillRect(x + L * 0.07, y + 4, 4, H - 8);
    // 本体
    ctx.fillStyle = metal(y, H, SILVER); ctx.fillRect(x + L * 0.07 + 4, y, L * 0.86, H);
    // グリップ（黒いリブ）
    const gx = x + L * 0.14, gw = L * 0.42;
    ctx.fillStyle = metal(y - 1, H + 2, [[0, '#1b1d20'], [0.35, '#4a4f55'], [1, '#0e0f11']]); ctx.fillRect(gx, y - 1, gw, H + 2);
    for (let i = 0; i < 11; i++) { ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(gx + 4 + i * gw / 11, y - 1, 3, H + 2); ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(gx + 7 + i * gw / 11, y - 1, 2, H + 2); }
    // スイッチ（点灯中だけ光る）
    const sx = x + L * 0.66;
    ctx.fillStyle = metal(y - 7, 9, SILVER); this.rr(ctx, sx - 9, y - 7, 18, 9, 3); ctx.fill();
    ctx.beginPath(); ctx.arc(sx, y - 7, 5, Math.PI, 0);
    const off = [55, 60, 66], col = off.map((v, i) => Math.round(v + (acc[i] - v) * lvl));
    ctx.fillStyle = `rgb(${col.join(',')})`;
    if (lvl > 0.05) { ctx.shadowColor = `rgb(${acc.join(',')})`; ctx.shadowBlur = 12 * lvl; }
    ctx.fill(); ctx.shadowBlur = 0;
    // 細い溝
    ctx.fillStyle = 'rgba(0,0,0,.45)'; [0.6, 0.62, 0.78].forEach(p => ctx.fillRect(x + L * p, y, 2, H));
    // エミッター（少し太い＋スリット）
    const ex = x + L * 0.86;
    ctx.fillStyle = metal(y - 5, H + 10, SILVER); this.rr(ctx, ex, y - 5, L * 0.14, H + 10, 4); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.55)'; for (let i = 0; i < 3; i++) ctx.fillRect(ex + 8 + i * 10, y - 5, 4, 10);
  },
  mix(a, b, k){ k = Math.max(0, Math.min(1, k)); return a.map((v, i) => v + (b[i] - v) * k); },
  rr(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
};

  /** 標準構成（SYBER SABERS 出荷時） */
  defaults(buttons){
    const common = {multiPhase: true, bcMelt: true, editSettings: true, holdOff: false};
    return buttons === 1 ? {...common, hbl: false, spin: true} : {...common, hbl: true, spin: false};
  },

  /** config(.h) の CONFIG_TOP から define を読む */
  parseConfig(text){
    const strip = text.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/.*$/gm, '');
    const a = strip.indexOf('CONFIG_TOP'), b = strip.indexOf('#endif', a);
    const top = a >= 0 ? strip.slice(a, b > a ? b : undefined) : strip;
    const has = n => new RegExp('^\\s*#define\\s+' + n + '\\b', 'm').test(top);
    const nb = /^\s*#define\s+NUM_BUTTONS\s+(\d+)/m.exec(top);
    const num = n => { const m = new RegExp('^\\s*#define\\s+' + n + '\\s+(\\d+)', 'm').exec(top); return m ? +m[1] : null; };
    return {
      buttons: nb ? +nb[1] : null,
      defs: {hbl: has('FETT263_HOLD_BUTTON_LOCKUP'), spin: has('FETT263_SPIN_MODE'), multiPhase: has('FETT263_MULTI_PHASE'),
        bcMelt: has('FETT263_USE_BC_MELT_STAB'), editSettings: has('FETT263_EDIT_SETTINGS_MENU') || has('FETT263_EDIT_MODE_MENU'), holdOff: has('FETT263_HOLD_BUTTON_OFF')},
      gestures: {swingon: has('FETT263_SWING_ON') ? 1 : 0, twiston: has('FETT263_TWIST_ON') ? 1 : 0, twistoff: has('FETT263_TWIST_OFF') ? 1 : 0,
        thruston: has('FETT263_THRUST_ON') ? 1 : 0, stabon: has('FETT263_STAB_ON') ? 1 : 0, forcepush: has('FETT263_FORCE_PUSH') ? 1 : 0,
        powerlock: has('FETT263_POWER_LOCK') ? 1 : 0, gestureon: 1, swingonspeed: num('FETT263_SWING_ON_SPEED')}
    };
  },

  /** 表示する行を条件で絞る */
  rows(list, g, d){
    // モーション点灯は1行にまとめ、有効なものだけ並べる
    list = list.flatMap(r => {
      if (r[0] !== '__motion') return [r];
      const on = [['swingon', 'mSwing'], ['twiston', 'mTwist'], ['thruston', 'mThrust'], ['stabon', 'mStab']].filter(([k]) => g[k]);
      if (!on.length) return [];
      const ja = on.map(([, k]) => LANG.ja[k]).join('／'), en = on.map(([, k]) => LANG.en[k]).join(' / ');
      return [[LANG.ja.motionIgnite, LANG.en.motionIgnite, ja + `<br><small>${LANG.ja.swingBattleShort}</small>`, en + `<br><small>${LANG.en.swingBattleShort}</small>`]];
    });
    const ok1 = c => {
      if (c.startsWith('d:')) { const k = c.slice(2); return k.startsWith('!') ? !d[k.slice(1)] : !!d[k]; }
      return c.startsWith('!') ? !g[c.slice(1)] : !!g[c];
    };
    return list.filter(r => !r[4] || r[4].split('&').every(ok1));
  }
};

/** エフェクトを別のプリセットから選ぶ欄。ややこしいため、いったん非表示（true で復活） */
const SHOW_FX_SELECT = false;

/* =====================================================================
 * アプリ本体
 * ===================================================================== */
const App = {
  data: null, raw: [], busy: false, tab: 'presets', sel: 0, checked: new Set(), descCache: {},
  openDetails: new Set(), cfgOverride: null, sheetPresets: true, backedUp: false, advanced: false, form: null, dirty: false, linkBlades: true, volUnlocked: false, batTimer: null, live: false,

  /* ---------------- 起動 ---------------- */
  init(){
    lang = store.get('lang', (navigator.language || '').toLowerCase().startsWith('ja') ? 'ja' : 'en');
    // 上級者モードは非公開。URL の末尾に #advanced を付けて開いたときだけ使える（お店のサポート用）
    const advOk = /advanced/i.test(location.hash + location.search);
    this.advanced = advOk && store.get('advanced', false);
    $('advLabel').style.display = advOk ? '' : 'none';
    $('langSel').value = lang;
    $('langSel').onchange = () => { lang = $('langSel').value; store.set('lang', lang); this.renderAll(); };
    $('advToggle').checked = this.advanced;
    $('advToggle').onchange = () => { this.advanced = $('advToggle').checked; store.set('advanced', this.advanced); this.renderAll(); };
    $('btnConnect').onclick = () => this.connect();
    $('btnDisconnect').onclick = () => Proffie.disconnect();
    $('dlgOk').onclick = () => $('dlg').close();
    $('mailLink').onclick = e => { e.preventDefault(); this.openMail(); };
    Proffie.onChange = () => { if (!Proffie.connected) { this.live = false; clearInterval(this.batTimer); } this.renderAll(); };
    window.addEventListener('beforeunload', e => { if (this.busy) { e.preventDefault(); e.returnValue = t('leaveWarn'); } });
    this.renderAll();
    if ('serial' in navigator) {
      navigator.serial.addEventListener('disconnect', e => {
        if (Proffie.port === e.target) { Proffie.port = null; this.live = false; clearInterval(this.batTimer); this.renderAll(); if (!this.rebooting) toast(t('unplugged')); }
      });
      // 以前に許可したセーバーがつながっていれば、自動で接続して読み込む
      navigator.serial.getPorts().then(async ports => {
        const p = ports.find(x => x.getInfo().usbVendorId === 0x1209);
        if (p && !Proffie.connected) { try { await Proffie.open(p); await this.readWithBoot(); } catch { this.bootEnd(false); } }
      }).catch(() => {});
    }
  },

  async connect(){
    try {
      if (!(await Proffie.connect())) { this.openTrouble(); showDialog(t('noBoard'), t('noBoardBody')); return; }
      await this.readWithBoot();
    } catch (e) { this.bootEnd(false); this.openTrouble(); showDialog(e.title || t('error'), e.message); }
  },
  openTrouble(){ const d = $('trouble'); if (d) d.open = true;
  },

  async q(cmd, opt){
    if (Proffie.cancel) throw new Error('__cancel__');
    const t0 = performance.now();
    const r = await Proffie.query(cmd, opt);
    this.raw.push({cmd, text: r.text, whut: r.whut, timedOut: r.timedOut, at: Date.now(), ms: Math.round(performance.now() - t0)});
    if (this.raw.length > 600) this.raw.splice(0, this.raw.length - 600);
    return r;
  },

  /* ---------------- 処理中の表示 ---------------- */
  setBusy(on){ this.busy = on; document.body.classList.toggle('is-busy', on); if (!on) $('progress').hidden = true; this.renderHeader(); },
  progress(label, i, n){
    if (this.boot) this.bootUpdate(label, i, n);
    $('progress').hidden = false;
    $('progLabel').textContent = n ? `${label}… ${i} / ${n}` : `${label}…`;
    $('progBar').style.width = n ? `${Math.round(i / n * 100)}%` : '100%';
    $('progress').classList.toggle('indeterminate', !n);
  },

  /* ---------------- 初回接続のロード画面 ---------------- */
  async readWithBoot(){
    const first = !this.data;
    if (first) this.bootStart();
    await this.read();
    await this.bootEnd(first && this.live && !!this.data);
  },
  bootStart(){
    this.boot = {pct: 0};
    document.body.classList.add('booting');
    $('bootFill').style.width = '0%'; $('bootPct').textContent = '0'; $('bootStep').textContent = 'LINK ESTABLISHED'; $('bootSub').textContent = '';
    const el = $('boot'); el.classList.remove('out'); el.classList.add('on');
  },
  /** 読み込みの段階 → 進み具合（%）と表示する英字 */
  bootUpdate(label, i, n){
    if (!this.boot) return;
    const M = [['waiting', 4, 'LINK ESTABLISHED'], ['reading', 10, 'READ VERSION'], ['waitingSd', 14, 'WAITING FOR SD CARD'], ['readingPresets', 28, 'SYNC PRESETS'],
      ['readingSettings', 44, 'READ SETTINGS'], ['readingSd', 58, 'SCAN FONTS / TRACKS'], ['readingStyles', 66, 'READ STYLES'], ['reloadingFont', 96, 'RELOAD FONT']];
    const m = M.find(x => label === t(x[0]) || label.startsWith(t(x[0])));
    if (!m) return;
    let pct = m[1], step = m[2];
    if (m[0] === 'readingStyles' && n) { pct = 66 + Math.round(28 * i / n); step += ` ${String(i).padStart(2, '0')}/${String(n).padStart(2, '0')}`; }
    if (m[0] === 'readingPresets' && this.boot.n) step += ` ${String(this.boot.n).padStart(2, '0')}`;
    this.boot.pct = Math.max(this.boot.pct, pct);
    $('bootFill').style.width = this.boot.pct + '%'; $('bootPct').textContent = this.boot.pct; $('bootStep').textContent = step;
  },
  async bootEnd(ok){
    if (!this.boot) return;
    const el = $('boot');
    if (ok) {
      $('bootFill').style.width = '100%'; $('bootPct').textContent = '100'; $('bootStep').textContent = 'READY';
      await sleep(380);
      document.body.classList.add('reveal');
      setTimeout(() => document.body.classList.remove('reveal'), 600);
    }
    el.classList.add('out'); el.classList.remove('on');
    document.body.classList.remove('booting');
    this.boot = null;
    setTimeout(() => el.classList.remove('out'), 400);
  },

  /* ---------------- 読み込み ---------------- */
  async read(){
    if (this.busy) return;
    this.setBusy(true); Proffie.cancel = false; this.backedUp = false;
    const d = {readAt: fmtDate(), board: null, settings: {}, presets: [], fonts: null, tracks: null, blades: [], gestures: null, battery: null};
    try {
      await Proffie.run(async () => {
        this.progress(t('waiting'));
        const tRead = performance.now();
        await Proffie.settle(200);
        this.progress(t('reading'));
        const ver = await this.q('version', {timeoutMs: 5000});
        if (ver.timedOut || !ver.text.trim()) { const e = new Error(t('noReplyBody')); e.title = t('noReply'); throw e; }
        d.board = PP.version(ver.text);
        if (this.boot) $('bootSub').textContent = `${(d.board.config || '').split('/').pop()} // ProffieOS ${d.board.version}`;
        const sd = await this.waitSd(), sdWaited = sd.waited;
        this.progress(t('readingPresets'));
        await this.readPresets(d);
        this.progress(t('readingSettings'));
        const s = d.settings;
        s.volume = PP.number(await this.q('get_volume'));
        const pending = store.get('pendingVolume', null);
        if (pending > 0 && s.volume === 0) { await this.q(`set_volume ${Math.min(pending, VOL_SAFE)}`); s.volume = Math.min(pending, VOL_SAFE); toast(t('volRestored', {v: s.volume})); }
        store.set('pendingVolume', null);
        s.clash = PP.number(await this.q('get_clash_threshold'));
        s.dimming = PP.number(await this.q('get_blade_dimming'));
        d.battery = PP.number(await this.q('battery_voltage'));
        Batt.reset(); Batt.push(d.battery);
        const nb = Math.max(0, ...d.presets.map(p => p.styles.length));
        for (let b = 1; b <= nb; b++) d.blades.push({blade: b, length: PP.number(await this.q(`get_blade_length ${b}`)), max: PP.number(await this.q(`get_max_blade_length ${b}`))});
        const g0 = await this.q(`get_gesture ${GESTURES[0].key}`);
        if (!g0.whut) {
          d.gestures = {[GESTURES[0].key]: PP.number(g0)};
          for (const g of GESTURES.slice(1)) d.gestures[g.key] = PP.number(await this.q(`get_gesture ${g.key}`));
        }
        this.progress(t('readingSd'));
        d.fonts = PP.lines(sd.fonts);                 // SD の確認で読んだ一覧をそのまま使う（2回読まない）
        d.tracks = PP.lines(await this.q('list_tracks', {timeoutMs: 30000}));
        // スタイルの既定値はファームウェアで決まるので、同じファームなら前回読んだものを使う
        this.descKey = 'desc.' + (d.board.config || '') + '|' + (d.board.installed || '');
        this.descCache = store.get(this.descKey, null) || {};
        await this.loadDescribes(d);
        d.on = PP.number(await this.q('get_on'));
        this.note(`read: ${Math.round(performance.now() - tRead)} ms`);
        // 起動時に SD を読めなかった場合、今のプリセットのフォントが読み込まれていないので読み込み直す
        if (sdWaited && d.settings.preset >= 0) {
          this.progress(t('reloadingFont'));
          await this.q(`set_preset ${d.settings.preset}`);
          await sleep(2500);
        }
      });
      this.data = d; this.live = true;
      if (d.on != null) Preview.setState(d.on === 1);
      this.sel = Math.min(d.settings.preset ?? 0, d.presets.length - 1); this.checked.clear();
      this.loadForm();
      this.startBattery();
      this.renderAll();
      this.setStatus(() => t('readDone', {t: d.readAt.slice(11)}));
    } catch (e) {
      if (e.message === '__cancel__') toast(t('cancelled'));
      else showDialog(e.title || t('error'), e.message);
    } finally { this.setBusy(false); this.renderAll(); }
  },
  /** SD カードが使えるまで待つ（再起動直後はパソコンが SD をドライブとして読みにいくため、しばらく使えない） */
  /** 終わりの時間がわからない待ち用のゲージ（最初は速く、だんだんゆっくり。95% で止まる） */
  gauge(label){
    const t0 = Date.now(), bar = $('progBar');
    const draw = p => { if (this.boot) this.bootUpdate(label); $('progress').hidden = false; $('progress').classList.remove('indeterminate'); bar.style.width = p + '%'; $('progLabel').textContent = `${label}… ${p}%`; };
    const tick = () => draw(Math.min(95, Math.round(100 * (1 - Math.exp(-(Date.now() - t0) / 25000)))));
    tick();
    const id = setInterval(tick, 200);
    return async done => { clearInterval(id); if (done) { draw(100); await sleep(500); } };
  },
  async waitSd(maxMs = 120000){
    const t0 = Date.now();
    let stop = null;
    try {
      while (true) {
        const r = await this.q('list_fonts', {timeoutMs: 30000});
        if (!/Failed to mount SD card|SD card is busy/i.test(r.text)) { if (stop) await stop(true); return {waited: !!stop, fonts: r}; }
        if (!stop) stop = this.gauge(t('waitingSd'));
        if (Date.now() - t0 > maxMs) { const e = new Error(t('sdBusyBody')); e.title = t('sdBusy'); throw e; }
        // 確認が続くと SD の初期化が終わらず回復しないため、間を十分にあける
        await sleep(12000);
      }
    } finally { if (stop) stop(false); }
  },
  async readPresets(d){
    const lp = await this.q('list_presets', {timeoutMs: 30000});
    if (lp.timedOut) throw new Error(t('stopTimeout'));
    d.presets = PP.presets(lp.text);
    d.settings.preset = PP.number(await this.q('get_preset'));
    d.settings.variation = PP.number(await this.q('get_variation'));
  },
  async loadDescribes(d){
    const keys = [];
    for (const p of d.presets) for (const s of p.styles) {
      const st = PP.style(s);
      if (st.builtin) { const k = `${st.builtin.preset} ${st.builtin.blade}`; if (!(k in this.descCache) && !keys.includes(k)) keys.push(k); }
    }
    for (let i = 0; i < keys.length; i++) {
      this.progress(t('readingStyles'), i + 1, keys.length);
      const r = await this.q(`describe_named_style builtin ${keys[i]}`);
      this.descCache[keys[i]] = r.whut ? null : PP.describe(r.text);
    }
    if (keys.length && this.descKey) {
      for (const k of store.keys('desc.')) if (k !== this.descKey) store.del(k);   // 古いファームの分は消す
      store.set(this.descKey, this.descCache);
    }
  },
  startBattery(){
    clearInterval(this.batTimer);
    this.batTimer = setInterval(async () => {
      if (!this.live || this.busy) return;
      try {
        const v = PP.number(await Proffie.run(() => Proffie.query('battery_voltage', {timeoutMs: 2000})));
        if (v != null && this.data) { this.data.battery = v; Batt.push(v); const el = $('batVal'); if (el) el.innerHTML = battHtml(); }
      } catch {}
    }, 15000);
  },

  /* ---------------- 変更（共通） ---------------- */
  backupSig(){ const d = this.data; return JSON.stringify([d.board.config, d.presets, d.settings.volume, d.settings.clash, d.settings.dimming, d.blades, d.gestures]); },
  backupText(memo){
    const d = this.data;
    let x = `# Proffie Web Config backup\n# saved: ${fmtDate()}\n# config: ${d.board.config} / ProffieOS: ${d.board.version}\n` + (memo ? `# memo: ${memo.replace(/\n/g, ' ')}\n` : '');
    x += `\n## settings\nvolume=${d.settings.volume}\nclash_threshold=${d.settings.clash}\nblade_dimming=${d.settings.dimming}\n` +
      d.blades.map(b => `blade_length${b.blade}=${b.length}`).join('\n') + '\n' +
      (d.gestures ? Object.entries(d.gestures).map(([k, v]) => `gesture.${k}=${v}`).join('\n') + '\n' : '');
    x += `\n## presets (${d.presets.length})\n` + d.presets.map(p =>
      `FONT=${p.font}\nTRACK=${p.track}\n${p.styles.map((s, i) => `STYLE${i + 1}=${s}`).join('\n')}\nNAME=${p.name.replace(/\\/g, '\\\\').replace(/\n/g, '\\n')}\nVARIATION=${p.variation}`).join('\n') + '\n';
    return x;
  },
  fileBase(){ return `${(this.data.board.config || 'proffie').split('/').pop().replace(/\.h$/, '').replace(/[\\/:*?"<>|\s]/g, '_')}_${stamp()}`; },
  backups(){ return store.get('backups', []); },
  storeBackups(list){ let a = 0; store.set('backups', list.filter(b => b.manual || ++a <= 5).slice(0, 40)); },
  autoBackup(){
    if (this.backedUp) return;
    this.backedUp = true;
    const sig = this.backupSig(), list = this.backups();
    if (list.length && list[0].sig === sig) return;
    list.unshift({at: fmtDate(), config: this.data.board.config, count: this.data.presets.length, sig, text: this.backupText(), file: `backup_auto_${this.fileBase()}.txt`});
    this.storeBackups(list);
  },
  manualBackup(){
    const memo = prompt(t('memoPrompt'), '');
    if (memo === null) return;
    const text = this.backupText(memo.trim());
    const safe = memo.trim().replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 30);
    const file = `backup_${this.fileBase()}${safe ? '_' + safe : ''}.txt`;
    const list = this.backups();
    list.unshift({at: fmtDate(), config: this.data.board.config, count: this.data.presets.length, sig: this.backupSig(), text, file, memo: memo.trim(), manual: true});
    this.storeBackups(list);
    downloadText(file, text);
    this.render();
  },

  /** コマンド列を実行してプリセットを読み直す。切り替えを伴う場合は処理中だけ音量0（font.wav のノイズ防止） */
  async change(label, cmdsFn, {reload = true, backup = true} = {}){
    if (!this.live || this.busy) return false;
    this.setBusy(true); Proffie.cancel = false;
    let ok = false;
    try {
      if (backup) this.autoBackup();
      const bad = [];
      await Proffie.run(async () => {
        const cmds = await cmdsFn();
        const vol = this.data.settings.volume;
        const mute = vol > 0 && cmds.some(c => /^(change_preset|set_preset|move_preset|duplicate_preset) /.test(c) || c === 'delete_preset');
        if (mute) { store.set('pendingVolume', vol); await this.q('set_volume 0'); }
        try {
          for (let k = 0; k < cmds.length; k++) {
            this.progress(label, k, cmds.length);
            if (cmds[k].startsWith('@expect ')) {
              const want = +cmds[k].slice(8), got = PP.number(await this.q('get_preset'));
              if (got !== want) throw new Error(t('stopWrong'));
              continue;
            }
            const r = await this.q(cmds[k], {timeoutMs: 20000});
            if (r.timedOut) throw new Error(t('stopTimeout'));
            if (/Failed to mount SD card/i.test(r.text)) { const e = new Error(t('sdBusyBody')); e.title = t('sdBusy'); throw e; }
            if (r.whut) bad.push(cmds[k].split(' ')[0]);
          }
          if (reload) {
            this.progress(t('readingPresets'));
            await this.readPresets(this.data);
            await this.loadDescribes(this.data);
          }
        } finally {
          if (mute) {
            const sv = cmds.filter(c => c.startsWith('set_volume ')).pop();
            const back = sv ? +sv.slice(11) : vol;
            await this.q(`set_volume ${back}`).catch(() => {});
            this.data.settings.volume = back;
            store.set('pendingVolume', null);
          }
        }
      });
      ok = true;
      const at = fmtDate().slice(11);
      this.setStatus(() => bad.length ? `${t('someUnsupported')}${P().l}${bad.join(', ')}${P().r}` : t('savedAt', {t: at}));
    } catch (e) {
      showDialog(e.title || t('error'), e.message === '__cancel__' ? t('cancelled') : e.message);
    } finally {
      this.setBusy(false);
      this.loadForm();
      this.render();
    }
    return ok;
  },
  sel_(i){ return [`change_preset ${i}`, `@expect ${i}`]; },

  /* ---------------- プリセット操作 ---------------- */
  selectPreset(i){
    if (i === this.sel) return;
    if (this.dirty && !confirm(t('confirmUnsaved'))) return;
    this.sel = i; this.loadForm(); this.render();
  },
  async switchTo(i){
    if (!this.live || this.busy) return;
    if (i !== this.sel && !this.dirty) { this.sel = i; this.loadForm(); }
    this.setBusy(true);
    try {
      await Proffie.run(async () => {
        this.progress(t('opSwitch'));
        const r = await this.q(`set_preset ${i}`);
        if (/Failed to mount SD card/i.test(r.text)) { const e = new Error(t('sdBusyBody')); e.title = t('sdBusy'); throw e; }
        await sleep(2500);                          // font.wav が鳴り終わるまで重い通信をしない
        this.data.settings.preset = PP.number(await this.q('get_preset'));
        this.data.settings.variation = PP.number(await this.q('get_variation'));
        const on = PP.number(await this.q('get_on'));
        if (on != null) Preview.setState(on === 1);
      });
    } catch (e) { showDialog(e.title || t('error'), e.message); }
    finally { this.setBusy(false); this.render(); }
  },
  moveTo(from, to){
    const n = this.data.presets.length;
    to = Math.max(0, Math.min(n - 1, to));            // 範囲外だと ProffieOS がプリセットを消すので必ず範囲内
    if (to === from) return;
    if (this.dirty && !confirm(t('confirmUnsaved'))) return;
    this.sel = to;
    return this.change(t('opMove'), async () => [...this.sel_(from), `move_preset ${to}`]);
  },
  duplicate(i){
    if (this.dirty && !confirm(t('confirmUnsaved'))) return;
    this.sel = i + 1;
    return this.change(t('opDup'), async () => [...this.sel_(i), `duplicate_preset ${i + 1}`, `set_preset ${i + 1}`]);
  },
  deletePresets(list){
    const d = this.data, n = d.presets.length;
    const del = [...new Set(list)].filter(i => i < n).sort((a, b) => b - a);
    if (!del.length) return;
    if (del.length >= n) { showDialog(t('error'), t('cantDeleteAll')); return; }
    const names = del.slice().reverse().map(i => `${i + 1}. ${d.presets[i].name}`);
    if (!confirm(t('confirmDelete', {n: del.length, list: names.slice(0, 15).join('\n') + (names.length > 15 ? '\n…' : '')}))) return;
    const cur = d.settings.preset ?? 0, below = del.filter(i => i < cur).length;
    const newCur = Math.max(0, Math.min(cur - below, n - del.length - 1));
    this.checked.clear(); this.sel = Math.min(this.sel, n - del.length - 1);
    return this.change(t('opDelete'), async () => [...del.flatMap(i => [...this.sel_(i), 'delete_preset']), `set_preset ${newCur}`]);
  },
  unnamed(){ return this.data.presets.map((p, i) => ({p, i})).filter(({p}) => !p.name || p.name === '0' || /^Preset: \d+$/.test(p.name)); },
  fontLabel(p){ return (p.font || '').split(';')[0].split('/').pop(); },
  autoName(){
    const list = this.unnamed();
    if (!confirm(t('confirmAutoName', {n: list.length, ex: list.slice(0, 3).map(({p}) => this.fontLabel(p)).join(', ')}))) return;
    const back = this.data.settings.preset ?? 0;
    return this.change(t('opAutoName'), async () => [...list.flatMap(({p, i}) => [...this.sel_(i), `set_name ${this.fontLabel(p) || 'Preset ' + (i + 1)}`]), `set_preset ${back}`]);
  },

  /* ---------------- ブレードの名前 ---------------- */
  /** Fett263：フォント（と common）の tracks フォルダに曲があると、トラックプレイヤーはそちらを使う。
   *  プリセットの BGM が鳴るのは「BGM 再生」（真上に向けて）のときだけ */
  trackNote(font){
    const d = this.data;
    if (!d.tracks || !/fett263/i.test(d.board.prop || '')) return '';
    const dirs = (font || '').split(';').filter(Boolean).map(x => x.toLowerCase() + '/tracks/');
    const n = d.tracks.filter(x => dirs.some(p => x.toLowerCase().startsWith(p))).length;
    return n ? t('trackNote', {n}) : '';
  },

  bladeName(b){   // b は 1 始まり：LED1、LED2 …
    const bl = this.data.blades.find(x => x.blade === b), n = bl && bl.max;
    return t('blade', {n: b}) + (n ? `${P().l}${n} LED${P().r}` : '');
  },

  /* ---------------- 編集フォーム ---------------- */
  descOf(p, b){ const st = PP.style(p.styles[b]); return st.builtin ? this.descCache[`${st.builtin.preset} ${st.builtin.blade}`] : null; },
  /** ブレード b の引数一覧：{no, type, value(今の値), def(既定値), set(明示指定されているか)} */
  argsOf(p, b){
    const st = PP.style(p.styles[b]), desc = this.descOf(p, b);
    if (!st.builtin || !desc) return [];
    const out = [];
    for (let k = 1; k < desc.length; k++) {
      const dd = desc[k];
      if (!dd || dd.type === 'VOID') continue;
      const set = st.args[k] != null && st.args[k] !== '~' ? st.args[k] : null;
      out.push({no: k, type: dd.type, value: set ?? dd.def, def: dd.def, set: set != null});
    }
    return out;
  },
  loadForm(){
    const p = this.data && this.data.presets[this.sel];
    if (!p) { this.form = null; this.dirty = false; return; }
    this.form = {name: p.name, font: p.font, track: p.track, variation: this.sel === this.data.settings.preset ? (this.data.settings.variation ?? p.variation) : p.variation,
      args: p.styles.map((_, b) => Object.fromEntries(this.argsOf(p, b).map(a => [a.no, a.set ? a.value : '~']))), raw: p.styles.slice(), fx: p.styles.map(() => null)};
    this.dirty = false;
  },
  setDirty(){ this.dirty = true; const bar = $('saveBar'); if (bar) bar.classList.add('dirty'); ['btnSave', 'btnRevert'].forEach(id => { const el = $(id); if (el) el.disabled = false; }); },
  /** 色・数値の変更をフォームに反映（全ブレード連動ならほかのブレードにも） */
  setArg(b, k, v){
    const p = this.data.presets[this.sel];
    const targets = this.linkBlades ? p.styles.map((_, x) => x) : [b];
    for (const x of targets) if (x === b || this.argsOf(p, x).some(a => a.no === k)) this.form.args[x][k] = v;
    this.setDirty();
  },
  /** LED b のエフェクトを key（"P B" ＝ ファーム内の builtin スタイル）に変える。色（COLOR）は今の見た目のまま引き継ぐ */
  fxStyle(p, b, key){
    const [P, B] = key.split(' ').map(Number), desc = this.descCache[key], ch = {};
    if (desc) for (const a of this.argsOf(p, b)) {
      if (a.type !== 'COLOR' || !desc[a.no] || desc[a.no].type !== 'COLOR') continue;
      ch[a.no] = this.effective(b, a.no);
    }
    return PP.buildStyle(`builtin ${P} ${B}`, ch);
  },
  /** LED b で選べるエフェクトの一覧。名前は「そのエフェクトを使っているプリセット」で表す */
  fxSources(p, b){
    const keys = new Map(), blade = (PP.style(p.styles[b]).builtin || {}).blade ?? b + 1;
    const add = k => { if (!keys.has(k)) keys.set(k, []); };
    this.data.presets.forEach((q, j) => {
      const st = PP.style(q.styles[b]).builtin;
      if (st && st.blade === blade) { add(`${st.preset} ${st.blade}`); keys.get(`${st.preset} ${st.blade}`).push(`${j + 1}. ${q.name}`); }
    });
    // 今はどのプリセットも使っていないが、ファームに入っているエフェクト（読み込み済みのもの）
    for (const k of Object.keys(this.descCache)) if (this.descCache[k] && +k.split(' ')[1] === blade) add(k);
    return [...keys].sort((x, y) => +x[0].split(' ')[0] - +y[0].split(' ')[0])
      .map(([key, users]) => ({key, label: users.length ? users.join(' / ') : t('fxUnused', {n: +key.split(' ')[0] + 1})}));
  },
  effective(b, k){ const p = this.data.presets[this.sel], a = this.argsOf(p, b).find(x => x.no === k); const v = this.form.args[b][k]; return v === '~' || v == null ? (a ? a.def : '') : v; },
  buildSaveCmds(){
    const i = this.sel, p = this.data.presets[i], f = this.form, cmds = [];
    if (f.name.trim() && f.name.trim() !== p.name) cmds.push(`set_name ${f.name.trim()}`);
    if (f.font !== p.font) cmds.push(`set_font ${f.font}`);
    if (f.track !== p.track && f.track) cmds.push(`set_track ${f.track}`);
    p.styles.forEach((s, b) => {
      let ns = s;
      const rawEdited = this.advanced && f.raw[b].replace(/\s+/g, ' ').trim() !== s.trim();
      if (rawEdited) ns = f.raw[b].replace(/\s+/g, ' ').trim();
      else if (f.fx[b] != null) ns = this.fxStyle(p, b, f.fx[b]);
      else if (PP.style(s).builtin) {
        const ch = {};
        for (const a of this.argsOf(p, b)) {
          const v = f.args[b][a.no];
          const cur = a.set ? a.value : '~';
          if (v !== cur && !(v !== '~' && !a.set && v === a.def)) ch[a.no] = v;
        }
        if (Object.keys(ch).length) ns = PP.buildStyle(s, ch);
      }
      if (ns && ns !== s) cmds.push(`set_style${b + 1} ${ns}`);
    });
    const reload = cmds.some(c => /^set_(font|track|style)/.test(c));
    if (this.advanced && +f.variation !== +(this.sel === this.data.settings.preset ? this.data.settings.variation : p.variation)) cmds.push(`variation ${parseInt(f.variation, 10) || 0}`);
    if (!cmds.length) return [];
    return [...this.sel_(i), ...cmds, ...(reload ? [`set_preset ${i}`] : [])];
  },
  async save(){
    const cmds = this.buildSaveCmds();
    if (!cmds.length) { toast(t('noChanges')); this.loadForm(); this.render(); return; }
    await this.change(t('opSave'), async () => cmds);
  },

  /* ---------------- 操作・設定 ---------------- */
  async action(cmd){
    if (!this.live || this.busy) return;
    try {
      const r = await Proffie.run(() => Proffie.query(cmd));
      if (r.whut) toast(t('notAvailable'));
    } catch (e) { showDialog(t('error'), e.message); }
  },
  async setVolume(v){
    if (!this.live) return;
    v = Math.max(0, Math.min(this.volUnlocked ? VOL_HARD : VOL_SAFE, Math.round(v)));
    await Proffie.run(() => Proffie.query(`set_volume ${v}`)).catch(() => {});
    this.data.settings.volume = v;
  },
  async saveSettings(){
    const d = this.data, s = d.settings, cmds = [];
    const c = parseFloat(($('setClash') || {}).value);
    if (s.clash != null && c > 0 && Math.abs(c - s.clash) > 1e-6) cmds.push(`set_clash_threshold ${c}`);
    const dm = $('setDim');
    if (s.dimming != null && dm) { const v = Math.round(Math.max(5, Math.min(100, +dm.value)) / 100 * 16384); if (Math.abs(v - s.dimming) > 82) cmds.push(`set_blade_dimming ${v}`); }
    document.querySelectorAll('.setLen').forEach(el => {
      const b = d.blades.find(x => x.blade === +el.dataset.b), v = parseInt(el.value, 10);
      const cur = b.length == null || b.length < 0 ? b.max : b.length;
      if (v > 0 && v !== cur) cmds.push(`set_blade_length ${b.blade} ${Math.min(v, b.max ?? v)}`);
    });
    document.querySelectorAll('.setG').forEach(el => {
      const k = el.dataset.k, v = el.type === 'checkbox' ? (el.checked ? 1 : 0) : parseInt(el.value, 10);
      if (!isNaN(v) && v !== d.gestures[k]) cmds.push(`set_gesture ${k} ${v}`);
    });
    if (!cmds.length) { toast(t('noChanges')); return; }
    const ok = await this.change(t('opSettings'), async () => cmds, {reload: false});
    if (ok) await this.refreshSettings();
  },
  async refreshSettings(){
    const d = this.data, s = d.settings;
    await Proffie.run(async () => {
      s.volume = PP.number(await this.q('get_volume'));
      s.clash = PP.number(await this.q('get_clash_threshold'));
      s.dimming = PP.number(await this.q('get_blade_dimming'));
      for (const b of d.blades) b.length = PP.number(await this.q(`get_blade_length ${b.blade}`));
      if (d.gestures) for (const g of GESTURES) d.gestures[g.key] = PP.number(await this.q(`get_gesture ${g.key}`));
    }).catch(() => {});
    this.render();
  },

  /* ---------------- バックアップから戻す ---------------- */
  parseBackup(text){
    text = text.replace(/\r/g, '');
    const num = k => { const m = new RegExp('^' + k.replace('.', '\\.') + '=(-?[\\d.]+)$', 'm').exec(text); return m ? +m[1] : null; };
    const b = {presets: PP.presets(text), volume: num('volume'), clash: num('clash_threshold'), dimming: num('blade_dimming'), gestures: {}, lengths: {}};
    for (const g of GESTURES) { const v = num('gesture.' + g.key); if (v != null) b.gestures[g.key] = v; }
    for (const m of text.matchAll(/^blade_length(\d+)=(-?\d+)$/gm)) b.lengths[+m[1]] = +m[2];
    const c = /^# config: (.*?) \//m.exec(text); b.config = c ? c[1] : '';
    return b;
  },
  planRestore(b){
    const d = this.data, T = b.presets, C = JSON.parse(JSON.stringify(d.presets)), cmds = [];
    const ident = p => p.styles.map(x => x.trim().split(/\s+/).slice(0, 3).join(' ')).join('|');
    const same = (x, y) => x.font === y.font && x.track === y.track && x.name === y.name && x.variation === y.variation && x.styles.join('\n') === y.styles.join('\n');
    for (let k = 0; k < T.length; k++) {
      const tp = T[k];
      let j = C.findIndex((c, x) => x >= k && same(c, tp));
      if (j < 0) j = C.findIndex((c, x) => x >= k && ident(c) === ident(tp));
      if (j < 0) {
        let src = C.findIndex(c => ident(c) === ident(tp)); if (src < 0) src = 0;
        cmds.push(...this.sel_(src), `duplicate_preset ${k}`, `@expect ${k}`);
        C.splice(k, 0, JSON.parse(JSON.stringify(C[src])));
      } else if (j !== k) {
        cmds.push(...this.sel_(j), `move_preset ${k}`, `@expect ${k}`);
        C.splice(k, 0, C.splice(j, 1)[0]);
      } else if (!same(C[k], tp)) cmds.push(...this.sel_(k));
      const c = C[k];
      if (c.font !== tp.font) cmds.push(`set_font ${tp.font}`);
      if (c.track !== tp.track && tp.track) cmds.push(`set_track ${tp.track}`);
      if (c.name !== tp.name && tp.name) cmds.push(`set_name ${tp.name}`);
      tp.styles.forEach((st, x) => { if (c.styles[x] !== st) cmds.push(`set_style${x + 1} ${st}`); });
      if (c.variation !== tp.variation) cmds.push(`variation ${tp.variation}`);
      C[k] = JSON.parse(JSON.stringify(tp));
    }
    while (C.length > T.length) { cmds.push(...this.sel_(T.length), 'delete_preset'); C.splice(T.length, 1); }
    if (cmds.length) cmds.push(`set_preset ${Math.min(d.settings.preset ?? 0, T.length - 1)}`);
    const s = d.settings;
    const bv = b.volume != null ? Math.min(b.volume, VOL_SAFE) : null;
    if (bv != null && s.volume != null && bv !== s.volume) cmds.push(`set_volume ${bv}`);
    if (b.clash != null && s.clash != null && b.clash !== s.clash) cmds.push(`set_clash_threshold ${b.clash}`);
    if (b.dimming != null && s.dimming != null && b.dimming !== s.dimming) cmds.push(`set_blade_dimming ${b.dimming}`);
    for (const bl of d.blades) {
      const want = b.lengths[bl.blade];
      if (want == null || bl.length == null || want === bl.length) continue;
      const v = want > 0 ? want : bl.max;
      if (v > 0) cmds.push(`set_blade_length ${bl.blade} ${v}`);
    }
    if (d.gestures) for (const [k, v] of Object.entries(b.gestures)) if (d.gestures[k] != null && d.gestures[k] !== v) cmds.push(`set_gesture ${k} ${v}`);
    return cmds;
  },
  async restore(text, label){
    if (!this.live || this.busy) return;
    const b = this.parseBackup(text), d = this.data;
    if (!b.presets.length) { showDialog(t('error'), t('restoreBad')); return; }
    if (b.presets[0].styles.length !== d.presets[0].styles.length) { showDialog(t('error'), t('restoreBladeMismatch')); return; }
    const cmds = this.planRestore(b), real = cmds.filter(c => !c.startsWith('@'));
    if (!real.length) { showDialog(t('restoreThis'), t('restoreSame')); return; }
    if (!confirm(t('confirmRestore', {label, bn: b.presets.length, bc: b.config, cn: d.presets.length, cc: d.board.config, n: real.length,
      warn: b.config && b.config !== d.board.config ? t('restoreOtherConfig') : ''}))) return;
    this.backedUp = false;
    if (!(await this.change(t('opRestore'), async () => cmds))) return;
    await this.refreshSettings();
    const key = p => [p.font, p.track, p.name, p.styles.join('|')].join('\n');
    const ok = this.data.presets.length === b.presets.length && this.data.presets.every((p, i) => key(p) === key(b.presets[i]));
    if (ok) { const n = b.presets.length; this.setStatus(() => t('restoreOk', {n})); }
    else showDialog(t('restoreThis'), t('restoreCheck'));
  },
  async factoryReset(){
    if (!this.live || this.busy) return;
    const w = {presets: $('frP').checked, global: $('frG').checked, gesture: $('frX') ? $('frX').checked : false};
    const files = [];
    if (w.presets) files.push('presets.ini', 'presets.tmp', 'curstate.ini', 'curstate.tmp');
    if (w.global) files.push('global.ini', 'global.tmp');
    if (w.gesture) files.push('gesture.ini', 'gesture.tmp');
    if (!files.length) return;
    const items = [w.presets && t('frPresets'), w.global && t('frGlobal'), w.gesture && t('frGesture')].filter(Boolean);
    if (!confirm(t('confirmFactory', {items: items.map(x => P().b + x).join('\n')}))) return;
    this.backedUp = false; this.autoBackup();
    this.setBusy(true);
    try {
      await Proffie.run(async () => { for (let k = 0; k < files.length; k++) { this.progress(t('opFactory'), k, files.length); await this.q(`del ${files[k]}`); } });
    } catch (e) { showDialog(t('error'), e.message); }
    finally { this.setBusy(false); }
    // ProffieOS は読み込んだ presets.ini の場所をメモリに覚えているので、消したら必ず再起動する（しないと空のプリセットを読む）
    await this.reboot();
  },

  /** 診断用：通信ログにメモを残す */
  note(msg){ this.raw.push({cmd: '# ' + msg, text: '', whut: false, timedOut: false, at: Date.now()}); },
  /** reset を送って再接続する（1回分） */
  async resetOnce(){
    try { await Proffie.write('reset\n'); } catch {}
    await sleep(400);
    await Proffie.disconnect().catch(() => {});
    await sleep(2500);
    for (let i = 0; i < 25; i++) {
      const p = (await navigator.serial.getPorts()).find(x => x.getInfo().usbVendorId === 0x1209);
      if (p) { try { await Proffie.open(p); await sleep(1500); await Proffie.settle(); return true; } catch {} }
      await sleep(600);
    }
    return false;
  },
  async sdOk(){ const r = await this.q('list_fonts', {timeoutMs: 30000}); return !/Failed to mount SD card|SD card is busy/i.test(r.text); },
  /** セーバーを再起動して、自動で再接続・読み込み。再起動後に SD を読めなければ、もう一度再起動を試す */
  async reboot(){
    if (!Proffie.connected) return;
    this.rebooting = true; this.live = false;
    this.setBusy(true);
    try {
      this.progress(t('rebooting'));
      // ボードが SD を手放す（Unmounting SD Card）のを待ってから再起動する
      const mark = Proffie.buf.length, t0 = Date.now();
      await sleep(2000);
      while (Date.now() - t0 < 15000 && !/Unmounting SD Card/i.test(Proffie.buf.slice(mark))) await sleep(200);
      this.note(`pre-reset wait ${Date.now() - t0}ms, unmount seen=${/Unmounting SD Card/i.test(Proffie.buf.slice(mark))}`);
      let connected = false, sd = false;
      for (let n = 1; n <= 3 && !sd; n++) {
        this.note(`reset #${n}`);
        this.progress(t('rebooting'), n, 3);
        connected = await this.resetOnce();
        if (!connected) break;
        sd = await this.sdOk();
        this.note(`after reset #${n}: sd ok=${sd}`);
      }
      this.setBusy(false);
      if (connected) { await this.read(); if (this.live) toast(t('rebooted')); }
      else showDialog(t('powerCycle'), t('reconnectBody'));
    } finally { this.rebooting = false; this.setBusy(false); this.renderAll(); }
  },

   * 表示

  /** タイトル横の状態表示。言語を切り替えたら作り直せるように、文章ではなく作り方を覚えておく */

  /** お問い合わせ：アドレスはページに文字で置かず、押したときに組み立てる（収集対策） */

    const info = ['', '', '----', `Proffie Web Config ${APP_VER}`, `ProffieOS: ${b ? b.version : '-'}`, `Config: ${b ? b.config : '-'}`, `Prop: ${b ? b.prop : '-'}`, `Browser: ${browser}`, `Language: ${lang}`];
    location.href = `mailto:${SHOP.mail.join('@')}?subject=${encodeURIComponent(t('mailSubject'))}&body=${encodeURIComponent(t('mailBody') + info.join('\n'))}`;

      <div class="board-r"><span>${t('built')} ${esc(fmtBuildDate(d.board.installed))}</span><span>${t('battery')} <span id="batVal">${battHtml()}</span></span>
      <button class="btn small" id="btnReload" ${this.live && !this.busy ? '' : 'disabled'}>${t('reload')}</button>

  /* ---------------- SD チェック（ボードの sdtest を使う） ---------------- */
  sdHtml(){

    let h = `<section class="card"><h3>${t('sdTitle')}</h3><p class="hint">${t('sdIntro')}</p>
